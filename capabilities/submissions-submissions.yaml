naftiko: 1.0.0-alpha2
info:
  label: SEC EDGAR Submissions & XBRL API — Submissions
  description: 'SEC EDGAR Submissions & XBRL API — Submissions. 1 operations. Lead operation: Get company filing submission
    history. Self-contained Naftiko capability covering one Sec Edgar business surface.'
  tags:
  - Sec Edgar
  - Submissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SEC_EDGAR_API_KEY: SEC_EDGAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: submissions-submissions
    baseUri: https://data.sec.gov
    description: SEC EDGAR Submissions & XBRL API — Submissions business capability. Self-contained, no shared references.
    resources:
    - name: submissions-CIK{cik}.json
      path: /submissions/CIK{cik}.json
      operations:
      - name: getcompanysubmissions
        method: GET
        description: Get company filing submission history
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: cik
          in: path
          type: string
          description: '10-digit Central Index Key (CIK) with leading zeros. Example: 0000320193 for Apple Inc.'
          required: true
  exposes:
  - type: rest
    namespace: submissions-submissions-rest
    port: 8080
    description: REST adapter for SEC EDGAR Submissions & XBRL API — Submissions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/submissions/cik-cik-json
      name: submissions-cik-cik-json
      description: REST surface for submissions-CIK{cik}.json.
      operations:
      - method: GET
        name: getcompanysubmissions
        description: Get company filing submission history
        call: submissions-submissions.getcompanysubmissions
        with:
          cik: rest.cik
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: submissions-submissions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SEC EDGAR Submissions & XBRL API — Submissions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-company-filing-submission-history
      description: Get company filing submission history
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: submissions-submissions.getcompanysubmissions
      with:
        cik: tools.cik
      outputParameters:
      - type: object
        mapping: $.
